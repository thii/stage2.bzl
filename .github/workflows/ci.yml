name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bazel_8:
    name: Bazel 8.7 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      USE_BAZEL_VERSION: 8.7.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Allow the hermetic Linux sandbox
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true

      - name: Exercise the hermetic Linux sandbox
        run: bazel build --lockfile_mode=off //internal:hermetic-sandbox-smoke

      - name: Load the external consumer graph
        working-directory: e2e/consumer
        run: bazel query --lockfile_mode=off //...

  examples_linux_gcc:
    name: Examples (Linux GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build Linux-hosted GCC examples
        uses: ./.github/actions/build-examples
        with:
          targets: >-
            //aarch64-none-elf-gcc:dist
            //arm-none-eabi-gcc:dist
            //riscv-none-elf-gcc:dist
            //:hello
            //:hello-aarch64
            //:hello-arm
          verify-coverage: "true"

  examples_windows_gcc:
    name: Examples (Windows GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build Windows-hosted GCC examples
        uses: ./.github/actions/build-examples
        with:
          targets: >-
            //mingw-w64-gcc:dist
            //riscv-none-elf-gcc-w64:dist
            //riscv-none-elf-gcc-w64:riscv-none-elf-gcc-w64-pe-check
            //:hello-w64

  examples_darwin_arm64:
    name: Examples (Darwin arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build Darwin arm64 examples
        uses: ./.github/actions/build-examples
        with:
          targets: >-
            //clang:clang-darwin-arm64-dist
            //:hello-darwin

  examples_darwin_x86_64:
    name: Examples (Darwin x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build Darwin x86_64 examples
        uses: ./.github/actions/build-examples
        with:
          targets: //clang:clang-darwin-x86_64-dist

  consumer:
    name: External consumer bootstrap seed equivalence (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Reclaim runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Allow the hermetic Linux sandbox
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Cache pinned source downloads
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/stage2-e2e-repository-cache
          key: bazel-e2e-repositories-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'extensions.bzl', 'internal/gcc_source_repo.bzl', 'e2e/consumer/MODULE.bazel', 'e2e/consumer/MODULE.bazel.lock') }}
          restore-keys: |
            bazel-e2e-repositories-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true

      - name: Start shared Bazel remote cache
        id: remote_cache
        uses: thii/bazel-gha-remote-cache@6794727832d09a0a98c6edbbd013a10ddac2925a # v0.0.7
        with:
          expected-writers: "6"
          fail-job-on-cache-error: true
          github-token: ${{ github.token }}
          mode: read-write
          storage-mode: pack

      - name: Build seed lineages, smoke-test Zig+Bash, and compare outputs
        id: build
        timeout-minutes: 315
        working-directory: e2e/consumer
        env:
          REMOTE_CACHE_BAZELRC: ${{ steps.remote_cache.outputs.bazelrc }}
          REPOSITORY_CACHE: ${{ runner.temp }}/stage2-e2e-repository-cache
          STAGE2_ARTIFACTS: ${{ runner.temp }}/stage2-e2e-artifacts
          STAGE2_OUTPUT_BASE: ${{ runner.temp }}/stage2-e2e-output
        run: /usr/bin/timeout --signal=INT --kill-after=2m 300m bash compare-seeds.sh
