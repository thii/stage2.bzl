name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    name: External consumer bootstrap seed equivalence (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Reclaim runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Allow the hermetic Linux sandbox
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Cache pinned source downloads
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/stage2-e2e-repository-cache
          key: bazel-e2e-repositories-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'extensions.bzl', 'internal/gcc_combined_repo.bzl', 'e2e/consumer/MODULE.bazel', 'e2e/consumer/MODULE.bazel.lock') }}
          restore-keys: |
            bazel-e2e-repositories-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore musl.cc Bazel results
        id: muslcc_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/stage2-e2e-disk-cache/muslcc
          key: bazel-disk-e2e-v4-muslcc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-${{ hashFiles('.bazelignore', '.bazelrc', '.bazelversion', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'extensions.bzl', 'stage2.bzl', 'internal/**', 'trees/**', 'e2e/consumer/.bazelrc', 'e2e/consumer/**', '.github/workflows/ci.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bazel-disk-e2e-v4-muslcc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-${{ hashFiles('.bazelignore', '.bazelrc', '.bazelversion', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'extensions.bzl', 'stage2.bzl', 'internal/**', 'trees/**', 'e2e/consumer/.bazelrc', 'e2e/consumer/**', '.github/workflows/ci.yml') }}-
            bazel-disk-e2e-v4-muslcc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-

      - name: Restore Zig Bazel results
        id: zig_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/stage2-e2e-disk-cache/zig
          key: bazel-disk-e2e-v4-zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-${{ hashFiles('.bazelignore', '.bazelrc', '.bazelversion', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'extensions.bzl', 'stage2.bzl', 'internal/**', 'trees/**', 'e2e/consumer/.bazelrc', 'e2e/consumer/**', '.github/workflows/ci.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bazel-disk-e2e-v4-zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-${{ hashFiles('.bazelignore', '.bazelrc', '.bazelversion', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'extensions.bzl', 'stage2.bzl', 'internal/**', 'trees/**', 'e2e/consumer/.bazelrc', 'e2e/consumer/**', '.github/workflows/ci.yml') }}-
            bazel-disk-e2e-v4-zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-

      - name: Restore Toybox Bazel results
        id: toybox_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/stage2-e2e-disk-cache/toybox
          key: bazel-disk-e2e-v4-toybox-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-${{ hashFiles('.bazelignore', '.bazelrc', '.bazelversion', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'extensions.bzl', 'stage2.bzl', 'internal/**', 'trees/**', 'e2e/consumer/.bazelrc', 'e2e/consumer/**', '.github/workflows/ci.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bazel-disk-e2e-v4-toybox-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-${{ hashFiles('.bazelignore', '.bazelrc', '.bazelversion', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'extensions.bzl', 'stage2.bzl', 'internal/**', 'trees/**', 'e2e/consumer/.bazelrc', 'e2e/consumer/**', '.github/workflows/ci.yml') }}-
            bazel-disk-e2e-v4-toybox-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true

      # Leave time to save completed actions when a cold run needs another try.
      - name: Build three bootstrap seed lineages and compare their outputs
        id: build
        timeout-minutes: 315
        working-directory: e2e/consumer
        env:
          DISK_CACHE_ROOT: ${{ runner.temp }}/stage2-e2e-disk-cache
          REPOSITORY_CACHE: ${{ runner.temp }}/stage2-e2e-repository-cache
          STAGE2_ARTIFACTS: ${{ runner.temp }}/stage2-e2e-artifacts
          STAGE2_OUTPUT_BASE: ${{ runner.temp }}/stage2-e2e-output
        run: /usr/bin/timeout --signal=INT --kill-after=2m 300m bash compare-seeds.sh

      - name: Save musl.cc Bazel results
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/stage2-e2e-disk-cache/muslcc
          key: ${{ steps.muslcc_cache.outputs.cache-primary-key }}

      - name: Save Zig Bazel results
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/stage2-e2e-disk-cache/zig
          key: ${{ steps.zig_cache.outputs.cache-primary-key }}

      - name: Save Toybox Bazel results
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/stage2-e2e-disk-cache/toybox
          key: ${{ steps.toybox_cache.outputs.cache-primary-key }}
