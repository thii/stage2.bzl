name: Build example toolchains

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

# Linux and Windows save one complete result cache per build-input
# fingerprint. Darwin saves one immutable snapshot per attempt so a timed-out
# build can resume. Queue workflow runs to keep each lineage ordered.
concurrency:
  group: build-example-toolchains
  cancel-in-progress: false

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      BAZEL_CACHE_SCOPE: linux-${{ matrix.arch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Reclaim runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Allow the hermetic Linux sandbox
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Cache pinned source downloads
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/stage2-repository-cache
          key: bazel-repositories-v2-${{ env.BAZEL_CACHE_SCOPE }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'internal/gcc_combined_repo.bzl') }}
          restore-keys: |
            bazel-repositories-v2-${{ env.BAZEL_CACHE_SCOPE }}-
            bazel-repositories-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Bazel results
        id: bazel_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/stage2-disk-cache
          key: bazel-disk-v2-${{ env.BAZEL_CACHE_SCOPE }}-${{ hashFiles('.bazelversion') }}-${{ hashFiles('.bazelignore', '.bazelrc', '.bazelversion', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'stage2.bzl', 'internal/**', 'trees/**', 'examples/**', '.github/workflows/build-example-toolchains.yml') }}
          restore-keys: |
            bazel-disk-v2-${{ env.BAZEL_CACHE_SCOPE }}-${{ hashFiles('.bazelversion') }}-

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0

      # Each action already invokes make -j4, so keep one Bazel action active.
      - name: Build Linux toolchain
        run: |
          bazel build \
            --jobs=1 \
            --repository_cache="$RUNNER_TEMP/stage2-repository-cache" \
            --disk_cache="$RUNNER_TEMP/stage2-disk-cache" \
            //examples/riscv-none-elf-gcc:dist

      - name: Save Bazel results
        if: ${{ success() && steps.bazel_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/stage2-disk-cache
          key: ${{ steps.bazel_cache.outputs.cache-primary-key }}

      - name: Upload Linux toolchain
        uses: actions/upload-artifact@v6
        with:
          name: riscv-none-elf-gcc-linux-${{ matrix.arch }}
          path: bazel-bin/examples/riscv-none-elf-gcc/riscv-none-elf-gcc-15.2.0.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows:
    name: Windows (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BAZEL_CACHE_SCOPE: windows-x86_64
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Reclaim runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Allow the hermetic Linux sandbox
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Cache pinned source downloads
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/stage2-repository-cache
          key: bazel-repositories-v2-${{ env.BAZEL_CACHE_SCOPE }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'internal/gcc_combined_repo.bzl') }}
          restore-keys: |
            bazel-repositories-v2-${{ env.BAZEL_CACHE_SCOPE }}-
            bazel-repositories-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Bazel results
        id: bazel_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/stage2-disk-cache
          key: bazel-disk-v2-${{ env.BAZEL_CACHE_SCOPE }}-${{ hashFiles('.bazelversion') }}-${{ hashFiles('.bazelignore', '.bazelrc', '.bazelversion', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'stage2.bzl', 'internal/**', 'trees/**', 'examples/**', '.github/workflows/build-example-toolchains.yml') }}
          restore-keys: |
            bazel-disk-v2-${{ env.BAZEL_CACHE_SCOPE }}-${{ hashFiles('.bazelversion') }}-

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0

      - name: Build Windows toolchain and PE check
        run: |
          bazel build \
            --jobs=1 \
            --repository_cache="$RUNNER_TEMP/stage2-repository-cache" \
            --disk_cache="$RUNNER_TEMP/stage2-disk-cache" \
            //examples/riscv-none-elf-gcc-w64:dist \
            //examples/riscv-none-elf-gcc-w64:riscv-none-elf-gcc-w64-pe-check

      - name: Save Bazel results
        if: ${{ success() && steps.bazel_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/stage2-disk-cache
          key: ${{ steps.bazel_cache.outputs.cache-primary-key }}

      - name: Upload Windows toolchain
        uses: actions/upload-artifact@v6
        with:
          name: riscv-none-elf-gcc-windows-x86_64
          path: bazel-bin/examples/riscv-none-elf-gcc-w64/riscv-none-elf-gcc-w64-15.2.0.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  darwin:
    name: Darwin (${{ matrix.arch }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: //examples/clang:clang-darwin-x86_64-dist
            file: bazel-bin/examples/clang/clang-darwin-x86_64.tar.gz
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: //examples/clang:clang-darwin-arm64-dist
            file: bazel-bin/examples/clang/clang-darwin-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      BAZEL_CACHE_SCOPE: darwin-${{ matrix.arch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Reclaim runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Allow the hermetic Linux sandbox
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Cache pinned source downloads
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/stage2-repository-cache
          key: bazel-repositories-v2-${{ env.BAZEL_CACHE_SCOPE }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'internal/gcc_combined_repo.bzl') }}
          restore-keys: |
            bazel-repositories-v2-${{ env.BAZEL_CACHE_SCOPE }}-
            bazel-repositories-${{ runner.os }}-${{ runner.arch }}-

      # A cold Darwin chain (stage 2, then a native LLVM, then a Canadian
      # LLVM) does not fit one 6-hour hosted job. A run- and attempt-specific
      # key saves partial progress, while restore-keys resumes the newest
      # cache in this target's lineage.
      - name: Restore Bazel results
        id: bazel_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/stage2-disk-cache
          key: bazel-disk-v2-${{ env.BAZEL_CACHE_SCOPE }}-${{ hashFiles('.bazelversion') }}-${{ hashFiles('.bazelignore', '.bazelrc', '.bazelversion', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'stage2.bzl', 'internal/**', 'trees/**', 'examples/**', '.github/workflows/build-example-toolchains.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bazel-disk-v2-${{ env.BAZEL_CACHE_SCOPE }}-${{ hashFiles('.bazelversion') }}-${{ hashFiles('.bazelignore', '.bazelrc', '.bazelversion', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'stage2.bzl', 'internal/**', 'trees/**', 'examples/**', '.github/workflows/build-example-toolchains.yml') }}-
            bazel-disk-v2-${{ env.BAZEL_CACHE_SCOPE }}-${{ hashFiles('.bazelversion') }}-
            bazel-disk-darwin-${{ matrix.arch }}-

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0

      # timeout(1) interrupts Bazel cleanly before the job deadline so
      # the cache save step still runs. Exit 124 — timed out, partial
      # progress cached — is success for this step; a real build error
      # still fails it.
      - name: Build Darwin toolchain
        id: build
        run: |
          set +e
          timeout --signal=INT 320m bazel build \
            --jobs=1 \
            --repository_cache="$RUNNER_TEMP/stage2-repository-cache" \
            --disk_cache="$RUNNER_TEMP/stage2-disk-cache" \
            "${{ matrix.target }}"
          build_status=$?
          set -e
          if [[ $build_status -eq 124 ]]; then
            echo "::notice::Darwin ${{ matrix.arch }} reached this run's build budget; completed actions will be cached for the next run."
            exit 0
          fi
          exit "$build_status"

      - name: Save Bazel results
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/stage2-disk-cache
          key: ${{ steps.bazel_cache.outputs.cache-primary-key }}

      - name: Check whether the toolchain finished this run
        id: outcome
        run: |
          if [[ -f "${{ matrix.file }}" ]]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Darwin ${{ matrix.arch }} did not finish within this run's budget; progress is cached — re-run the workflow to resume."
          fi

      - name: Upload Darwin toolchain
        if: steps.outcome.outputs.built == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: clang-darwin-${{ matrix.arch }}
          path: ${{ matrix.file }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
