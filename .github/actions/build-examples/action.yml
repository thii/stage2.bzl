name: Build examples shard
description: Build one dependency-complete shard of the examples workspace

inputs:
  targets:
    description: Space-separated Bazel targets to build
    required: true
  verify-coverage:
    description: Check that all examples targets are covered by the CI shards
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Reclaim runner disk
      shell: bash
      run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

    - name: Allow the hermetic Linux sandbox
      shell: bash
      run: |
        if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi

    - name: Cache pinned source downloads
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/stage2-examples-repository-cache
        key: bazel-examples-repositories-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'extensions.bzl', 'internal/gcc_source_repo.bzl', 'examples/MODULE.bazel', 'examples/MODULE.bazel.lock', 'examples/gcc_combined_repo.bzl') }}
        restore-keys: |
          bazel-examples-repositories-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true

    - name: Verify shard coverage
      if: ${{ inputs.verify-coverage == 'true' }}
      shell: bash
      working-directory: examples
      run: |
        # Keep these roots in sync with the four shard inputs in ci.yml.
        uncovered=$(
          bazel query --lockfile_mode=error \
            --repository_cache="$RUNNER_TEMP/stage2-examples-repository-cache" \
            '//... except deps(set(
              //aarch64-none-elf-gcc:dist
              //arm-none-eabi-gcc:dist
              //riscv-none-elf-gcc:dist
              //:hello
              //:hello-aarch64
              //:hello-arm
              //mingw-w64-gcc:dist
              //riscv-none-elf-gcc-w64:dist
              //riscv-none-elf-gcc-w64:riscv-none-elf-gcc-w64-pe-check
              //:hello-w64
              //clang:clang-darwin-arm64-dist
              //:hello-darwin
              //clang:clang-darwin-x86_64-dist
            ))' \
            --output=label
        )
        if [[ -n "$uncovered" ]]; then
          printf 'Examples targets not covered by a CI shard:\n%s\n' "$uncovered" >&2
          exit 1
        fi

    # Every examples shard and consumer job intentionally uses the action's
    # default bazel-v1 namespace, so their independent adapters share one cache.
    - name: Start shared Bazel remote cache
      id: remote_cache
      uses: thii/bazel-gha-remote-cache@6794727832d09a0a98c6edbbd013a10ddac2925a # v0.0.7
      with:
        expected-writers: "6"
        # Cache-service throttling must not override a successful Bazel build.
        fail-job-on-cache-error: false
        github-token: ${{ github.token }}
        mode: read-write
        storage-mode: pack

    - name: Build examples shard
      shell: bash
      working-directory: examples
      env:
        EXAMPLE_TARGETS: ${{ inputs.targets }}
      run: |
        read -r -a targets <<< "$EXAMPLE_TARGETS"
        if (( ${#targets[@]} == 0 )); then
          echo "No examples targets were provided" >&2
          exit 1
        fi
        /usr/bin/timeout --signal=INT --kill-after=2m 300m \
          bazel --bazelrc="${{ steps.remote_cache.outputs.bazelrc }}" build \
            --jobs=1 \
            --repository_cache="$RUNNER_TEMP/stage2-examples-repository-cache" \
            "${targets[@]}"
